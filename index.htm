<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background 1.5s ease, color 1s ease;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            background: #1e3c72;
            position: relative;
        }

        /* --- УМНЫЙ СНЕГ --- */
        .snow-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .snow-container.active { opacity: 0.8; }
        
        .snow {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(100vh) translateX(20px); }
        }

        /* --- ГИРЛЯНДЫ --- */
        .garland {
            position: absolute;
            left: 0; width: 100%; height: 30px;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .garland.top { top: 0; }
        .garland.bottom { bottom: 0; }
        
        .light {
            width: 12px; height: 12px; border-radius: 50%;
            background-color: red; box-shadow: 0 0 10px red;
            animation: blink 1.5s infinite alternate;
        }
        .light:nth-child(2n) { background-color: #00FF00; box-shadow: 0 0 10px #00FF00; animation-delay: 0.3s; }
        .light:nth-child(3n) { background-color: #FFFF00; box-shadow: 0 0 10px #FFFF00; animation-delay: 0.6s; }
        .light:nth-child(4n) { background-color: #00FFFF; box-shadow: 0 0 10px #00FFFF; animation-delay: 0.9s; }
        .light:nth-child(5n) { background-color: #FF00FF; box-shadow: 0 0 10px #FF00FF; animation-delay: 1.2s; }
        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .app-container {
            width: 100%; max-width: 400px; height: 100vh; max-height: 800px;
            padding: 40px 20px 20px 20px;
            display: flex; flex-direction: column; position: relative; z-index: 5;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px; padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 0 10px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header p { font-size: 14px; opacity: 0.8; }

        .main-weather { display: flex; flex-direction: column; align-items: center; margin-top: 5px; }
        .main-weather .temp {
            font-size: 86px; font-weight: 300; line-height: 1;
            display: flex; align-items: flex-start; text-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .main-weather .temp span { font-size: 36px; margin-top: 12px; }
        .main-weather .description { font-size: 18px; font-weight: 400; margin-top: 5px; letter-spacing: 1px; }
        .main-weather .feels-like { font-size: 14px; opacity: 0.8; margin-top: 5px; }

        .icon-container { width: 110px; height: 110px; margin-bottom: 0px; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3)); }
        .icon-container svg { width: 100%; height: 100%; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .slider-wrapper {
            margin-top: 10px; padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .slider-labels { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #ddd; text-transform: uppercase; }
        .time-display { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        #time-label { font-weight: 600; }
        #time-value { font-weight: 600; color: #FFD700; }

        .custom-slider-track {
            width: 100%; height: 12px; background: #444; border-radius: 6px;
            border: 1px solid #888; position: relative; cursor: pointer; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .custom-slider-thumb {
            width: 28px; height: 28px; background: #ffffff; border-radius: 50%;
            border: 2px solid #222; position: absolute; top: -10px; left: 50%;
            transform: translateX(-50%); cursor: grab; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s; touch-action: none;
        }
        .custom-slider-thumb:active { cursor: grabbing; transform: translateX(-50%) scale(1.1); }

        .date-cards { display: flex; justify-content: space-between; margin-top: 10px; gap: 8px; }
        .date-card {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 8px 5px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        .date-card.today { background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .date-card .day-name { font-size: 11px; font-weight: 600; opacity: 0.8; text-transform: uppercase; }
        .date-card .date-num { font-size: 15px; font-weight: bold; margin-bottom: 2px; }
        .date-card .card-icon { width: 26px; height: 26px; margin-bottom: 2px; }
        .date-card .card-temp { font-size: 15px; font-weight: 600; }

        .info-row { display: flex; justify-content: space-between; margin-top: 8px; gap: 8px; }
        .info-item {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
            padding: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 12px;
            font-size: 13px; font-weight: 600;
        }
        .info-item svg { width: 16px; height: 16px; opacity: 0.8; }

        .tg-btn {
            position: absolute; bottom: 30px; right: 25px; width: 50px; height: 50px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.3s ease; z-index: 100; text-decoration: none;
        }
        .tg-btn:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-3px); }
        .tg-btn svg { width: 24px; height: 24px; fill: white; }
    </style>
</head>
<body>

    <div class="snow-container" id="snow-container"></div>

    <div class="garland top">
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
    </div>
    <div class="garland bottom">
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
        <div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div><div class="light"></div>
    </div>

    <div class="app-container">
        <div class="header">
            <div>
                <h1 id="city">Определение...</h1>
                <p id="date">Загрузка...</p>
            </div>
        </div>

        <div class="main-weather">
            <div class="icon-container" id="main-icon"></div>
            <div class="temp" id="temp">--<span>°C</span></div>
            <div class="description" id="desc">Загрузка...</div>
            <div class="feels-like" id="feels">Ощущается как --°</div>
        </div>

        <div class="slider-wrapper">
            <div class="slider-labels">
                <span>Утро</span><span>День</span><span>Вечер</span><span>Ночь</span>
            </div>
            <div class="time-display">
                <span id="time-label">Сейчас</span>
                <span id="time-value">--:--</span>
            </div>
            <div class="custom-slider-track" id="slider-track">
                <div class="custom-slider-thumb" id="slider-thumb"></div>
            </div>
        </div>

        <div class="info-row">
            <div class="info-item glass-panel">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                <span id="wind">-- м/с</span>
            </div>
            <div class="info-item glass-panel">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span id="humidity">--%</span>
            </div>
        </div>

        <div class="date-cards">
            <div class="date-card">
                <div class="day-name" id="d-name-0">Вчера</div>
                <div class="date-num" id="d-num-0">--.--</div>
                <div class="card-icon" id="d-icon-0"></div>
                <div class="card-temp" id="d-temp-0">--°</div>
            </div>
            <div class="date-card today">
                <div class="day-name">Сегодня</div>
                <div class="date-num" id="d-num-1">--.--</div>
                <div class="card-icon" id="d-icon-1"></div>
                <div class="card-temp" id="d-temp-1">--°</div>
            </div>
            <div class="date-card">
                <div class="day-name" id="d-name-2">Завтра</div>
                <div class="date-num" id="d-num-2">--.--</div>
                <div class="card-icon" id="d-icon-2"></div>
                <div class="card-temp" id="d-temp-2">--°</div>
            </div>
        </div>

        <a href="https://t.me/ROSHINO_TJM" target="_blank" class="tg-btn" title="Автор">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        </a>
    </div>

    <script>
        let isSnowingActive = false;
        function toggleSnow(activate) {
            const snowContainer = document.getElementById('snow-container');
            if (activate && !isSnowingActive) {
                isSnowingActive = true;
                snowContainer.classList.add('active');
                snowContainer.innerHTML = '';
                for (let i = 0; i < 40; i++) {
                    let snow = document.createElement('div');
                    snow.className = 'snow';
                    let size = Math.random() * 4 + 2;
                    snow.style.width = size + 'px';
                    snow.style.height = size + 'px';
                    snow.style.left = Math.random() * 100 + 'vw';
                    snow.style.animationDuration = Math.random() * 3 + 2 + 's';
                    snow.style.animationDelay = Math.random() * 5 + 's';
                    snowContainer.appendChild(snow);
                }
            } else if (!activate && isSnowingActive) {
                isSnowingActive = false;
                snowContainer.classList.remove('active');
            }
        }

        const icons = {
            sun: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`,
            moon: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`,
            cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>`,
            rain: `<svg viewBox="0 0 24 24" fill="none" stroke="#64B5F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><line x1="8" y1="21" x2="8" y2="23"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="16" y1="21" x2="16" y2="23"></line></svg>`,
            snow: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.58A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.25"></path><line x1="8" y1="16" x2="8" y2="20"></line><line x1="12" y1="16" x2="12" y2="20"></line><line x1="16" y1="16" x2="16" y2="20"></line></svg>`,
            storm: `<svg viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><polygon points="13 16 9 22 12 22 11 24 15 18 12 18 13 16" fill="#FFD700"></polygon></svg>`
        };

        let weatherData = null;
        let sunriseH = 8, sunsetH = 16; 
        let cityLat = 57.134748;
        let cityLon = 65.658854;
        let cityName = "Тюмень";

        // --- ОПРЕДЕЛЕНИЕ ГОРОДА (с очисткой от лишнего текста) ---
        async function reverseGeocode(lat, lon) {
            try {
                const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ru`);
                const data = await res.json();
                
                let rawCity = data.city || data.principalSubdivision || data.countryName || "Неизвестно";
                
                // Очистка: разбиваем по запятой и берем первую часть, убираем "городской округ"
                let cleanCity = rawCity.split(',')[0].trim();
                cleanCity = cleanCity.replace(/городской округ/i, '').trim();
                
                // Делаем первую букву заглавной
                if (cleanCity.length > 0) {
                    cleanCity = cleanCity.charAt(0).toUpperCase() + cleanCity.slice(1);
                }
                
                return cleanCity;
            } catch (e) {
                console.error("Ошибка геокодинга:", e);
                return "Тюмень";
            }
        }

        function getIconKey(code, isDay) {
            if (code === 0 || code === 1) return isDay ? 'sun' : 'moon';
            if (code >= 51 && code <= 67) return 'rain';
            if (code >= 71 && code <= 77) return 'snow';
            if (code >= 95) return 'storm';
            return 'cloud';
        }

        function updateTheme(hour, code) {
            const body = document.body;
            let isNight = (hour >= sunsetH || hour < sunriseH);
            let isMorning = (hour >= sunriseH && hour < sunriseH + 2);
            let isEvening = (hour >= sunsetH - 2 && hour < sunsetH);
            
            let theme = "";
            let isDarkText = false;

            if (isNight) theme = "linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)";
            else if (isMorning) { theme = "linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%)"; isDarkText = true; }
            else if (isEvening) theme = "linear-gradient(135deg, #fa709a 0%, #fee140 100%)";
            else theme = "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)";

            const isRain = (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || (code >= 95);
            const isSnow = (code >= 71 && code <= 77) || (code >= 85 && code <= 86);
            const isCloudy = (code === 2 || code === 3 || code === 45 || code === 48);

            toggleSnow(isSnow);

            if (isRain) { theme = "linear-gradient(135deg, #3a7bd5 0%, #3a6073 100%)"; isDarkText = false; }
            if (isSnow) { theme = "linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%)"; isDarkText = true; }
            if (isCloudy && !isNight && !isRain) { theme = "linear-gradient(135deg, #757F9A 0%, #D7DDE8 100%)"; isDarkText = true; }
            if (isCloudy && isNight) { theme = "linear-gradient(135deg, #141E30 0%, #243B55 100%)"; isDarkText = false; }

            body.style.background = theme;
            body.style.color = isDarkText ? "#1a1a1a" : "white";
        }

        function renderWeather(hour) {
            if (!weatherData) return;
            const current = weatherData.current;
            
            let temp = (hour === new Date().getHours()) ? current.temperature_2m : weatherData.hourly.temperature_2m[hour];
            let code = (hour === new Date().getHours()) ? current.weather_code : weatherData.hourly.weather_code[hour];
            let feels = (hour === new Date().getHours()) ? current.apparent_temperature : weatherData.hourly.apparent_temperature[hour];

            document.getElementById('temp').innerHTML = `${Math.round(temp)}<span>°C</span>`;
            document.getElementById('time-value').innerText = `${hour.toString().padStart(2, '0')}:00`;
            document.getElementById('feels').innerText = `Ощущается как ${Math.round(feels)}°`;
            document.getElementById('wind').innerText = `${current.wind_speed_10m} м/с`;
            document.getElementById('humidity').innerText = `${current.relative_humidity_2m}%`;
            document.getElementById('city').innerText = cityName;

            let isDayTime = (hour >= sunriseH && hour < sunsetH);
            let iconKey = getIconKey(code, isDayTime);
            
            let desc = 'Облачно';
            if (code <= 1) desc = 'Ясно';
            else if (code >= 51 && code <= 67) desc = 'Дождь';
            else if (code >= 71 && code <= 77) desc = 'Снег';
            else if (code >= 95) desc = 'Гроза';
            else if (code === 45 || code === 48) desc = 'Туман';

            document.getElementById('main-icon').innerHTML = icons[iconKey];
            document.getElementById('desc').innerText = desc;
            updateTheme(hour, code);
        }

        const track = document.getElementById('slider-track');
        const thumb = document.getElementById('slider-thumb');
        let isDragging = false;

        function updateSliderPosition(hour) {
            if (hour < 0) hour = 0;
            if (hour > 23) hour = 23;
            const percent = (hour / 23) * 100;
            thumb.style.left = `${percent}%`;
            document.getElementById('time-label').innerText = "Прогноз на";
            renderWeather(hour);
        }

        track.addEventListener('mousedown', (e) => { isDragging = true; handleDrag(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handleDrag(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });
        track.addEventListener('touchstart', (e) => { isDragging = true; handleDrag(e.touches[0]); });
        window.addEventListener('touchmove', (e) => { if (isDragging) { handleDrag(e.touches[0]); e.preventDefault(); } });
        window.addEventListener('touchend', () => { isDragging = false; });

        function handleDrag(e) {
            const rect = track.getBoundingClientRect();
            let x = e.clientX - rect.left;
            if (x < 0) x = 0;
            if (x > rect.width) x = rect.width;
            const hour = Math.round((x / rect.width) * 23);
            updateSliderPosition(hour);
        }

        async function getWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cityLat}&longitude=${cityLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,is_day,wind_speed_10m&hourly=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&past_days=1&forecast_days=3`);
                weatherData = await response.json();

                const sunriseStr = weatherData.daily.sunrise[1]; 
                const sunsetStr = weatherData.daily.sunset[1];
                sunriseH = parseInt(sunriseStr.split('T')[1].substring(0, 2));
                sunsetH = parseInt(sunsetStr.split('T')[1].substring(0, 2));

                const now = new Date();
                const currentHour = now.getHours();
                updateSliderPosition(currentHour);

                const days = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
                const months = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];

                for (let i = 0; i < 3; i++) {
                    let date = new Date(weatherData.daily.time[i]);
                    let dayName = days[date.getDay()];
                    let dateNum = `${date.getDate().toString().padStart(2, '0')}.${months[date.getMonth()]}`;
                    
                    if (i !== 1) document.getElementById(`d-name-${i}`).innerText = dayName;
                    
                    let tempMax = Math.round(weatherData.daily.temperature_2m_max[i]);
                    let dCode = weatherData.daily.weather_code[i];
                    let fIcon = getIconKey(dCode, true);

                    document.getElementById(`d-num-${i}`).innerText = dateNum;
                    document.getElementById(`d-temp-${i}`).innerText = `${tempMax}°`;
                    document.getElementById(`d-icon-${i}`).innerHTML = icons[fIcon];
                }

            } catch (e) {
                console.error(e);
                document.getElementById('desc').innerText = "Ошибка сети";
            }
        }

        // --- Инициализация с геолокацией ---
        async function initLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        cityLat = position.coords.latitude;
                        cityLon = position.coords.longitude;
                        
                        document.getElementById('city').innerText = "..."; 
                        cityName = await reverseGeocode(cityLat, cityLon);
                        
                        getWeather();
                    },
                    (error) => {
                        console.log("Геолокация отклонена, используем Тюмень");
                        cityName = "Тюмень";
                        getWeather();
                    }
                );
            } else {
                cityName = "Тюмень";
                getWeather();
            }
        }

        const months = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
        const d = new Date();
        document.getElementById('date').innerText = `${d.getDate()} ${months[d.getMonth()]}`;

        initLocation();
    </script>
</body>
</html>
